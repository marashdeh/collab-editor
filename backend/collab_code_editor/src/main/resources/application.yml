server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/collab_editor?createDatabaseIfNotExist=true
    username: YOUR_DB_USERNAME

    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # ✅ let Hibernate drop & recreate all tables
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      INDENT_OUTPUT: true

jwt:
  secret: YOUR_JWT_SECRET

  access:
    expiration: 900000           # 15 minutes
  refresh:
    expiration: 604800000        # 7 days

file:
  storage-path: ./code-editor-storage/
